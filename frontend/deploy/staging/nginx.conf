limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
map $http_x_forwarded_proto $staging_hsts {
    default '';
    https 'max-age=31536000';
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security $staging_hsts always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://api.dicebear.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /api/autenticacion/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Origin $http_origin;
    }
    # Runtime OpenAPI export remains protected by backend Basic authentication.
    location = /docs-json { proxy_pass http://backend:3000; }
    location ~ ^/docs { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
