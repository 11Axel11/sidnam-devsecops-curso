# Coolify builds with a separate environment file. Empty interpolation is allowed
# during image build only; MySQL and backend startup reject missing credentials.
services:
  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: sidnam_staging
      MYSQL_USER: sidnam_staging
      MYSQL_PASSWORD: ${DB_PASS:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
    volumes: [staging-db:/var/lib/mysql]
    networks: [isolated]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deploy/staging/Backend.Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: staging
      APP_ORIGIN: ${APP_ORIGIN:-}
      PORT: '3000'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: sidnam_staging
      DB_PASS: ${DB_PASS:-}
      DB_NAME: sidnam_staging
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_VERIFICATION_TOKEN_SECRET: ${JWT_VERIFICATION_TOKEN_SECRET:-}
      JWT_VERIFICATION_TOKEN_EXPIRATION_TIME: 15m
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
      AUTH_COOKIE_PREFIX: sidnam_staging_
      EXTERNAL_SERVICES: disabled
      E2E_ADMIN_PASSWORD: ${E2E_ADMIN_PASSWORD:-}
      E2E_READER_PASSWORD: ${E2E_READER_PASSWORD:-}
      E2E_INACTIVE_PASSWORD: ${E2E_INACTIVE_PASSWORD:-}
    command: [sh, -c, 'node dist/devsecops/database.js migrate && node dist/devsecops/database.js seed && exec node -r ./dist/config/register.js dist/main.js']
    depends_on:
      mysql: {condition: service_healthy}
    networks: [isolated]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 15
  backup:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    user: '999:999'
    environment:
      MYSQL_PWD: ${DB_PASS:-}
    entrypoint: [sh, -c]
    command:
      - |
        umask 077
        while true; do
          slot=$$(date -u +%u)
          if mysqldump -h mysql -u sidnam_staging --single-transaction --no-tablespaces sidnam_staging > /var/lib/mysql/staging.sql.tmp; then
            mv /var/lib/mysql/staging.sql.tmp /var/lib/mysql/staging-$$slot.sql
            echo 'Staging backup completed'
          else
            echo 'Staging backup failed' >&2
          fi
          sleep 86400
        done
    volumes: [staging-backups:/var/lib/mysql]
    networks: [isolated]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'find /var/lib/mysql -name "staging-*.sql" -mmin -1500 | grep -q .']
      interval: 60s
      retries: 2
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose: ['8080']
    labels:
      traefik.docker.network: coolify
    networks: [edge, isolated]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/health']
      interval: 10s
      retries: 6
networks:
  edge:
    name: coolify
    external: true
  isolated: {internal: true}
volumes:
  staging-db: {}
  staging-backups: {}
