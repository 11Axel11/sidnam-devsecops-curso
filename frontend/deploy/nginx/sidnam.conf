server {
    listen 80;
    server_name sidnam.org www.sidnam.org;

    # Point this to your deployed Vite build output.
    root /var/www/sidnam-administrativa/dist;
    index index.html;

    # Brotli/gzip can reduce transfer size for JS/CSS.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public images without hash should use shorter cache.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Keep HTML fresh so users receive new deployments.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
