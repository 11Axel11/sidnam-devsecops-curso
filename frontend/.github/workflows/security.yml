name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Pull scanning images
        run: node -e "const {execFileSync}=require('child_process');for(const [k,v] of Object.entries(require('./scripts/security/images.json')))if(k!=='zap')execFileSync('docker',['pull',v],{stdio:'inherit'})"
      - run: npm run security:scan
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-${{ github.sha }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
